apiVersion: v1
kind: Secret
metadata:
  name: stockguard-secrets
  labels:
    app.kubernetes.io/name: stockguard
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Replace with actual base64 or plaintext strings in private deployments
  DATABASE_URL: "postgresql+psycopg://<db_user>:<db_password>@stockguard-postgres:5432/stockguard"
  RABBITMQ_URL: "amqp://<rabbitmq_user>:<rabbitmq_password>@stockguard-rabbitmq:5672/"
