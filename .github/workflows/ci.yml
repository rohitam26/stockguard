name: StockGuard Production CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality, Typing & Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Quality & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit pip-audit -r requirements.txt
          pip install -e .

      - name: Ruff Linting Check
        run: python -m ruff check src/stockguard

      - name: Ruff Formatting Check
        run: python -m ruff format --check src/stockguard

      - name: MyPy Static Type Check
        run: python -m mypy src/stockguard

      - name: Bandit Security Scan
        run: python -m bandit -r src/stockguard -ll -q

      - name: Dependency Vulnerability Audit
        run: python -m pip_audit -r requirements.txt

  test:
    name: Integration Testing & Coverage
    runs-on: ubuntu-latest
    needs: code-quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: stockguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_running"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Alembic Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/stockguard
        run: |
          python -m alembic upgrade head

      - name: Run Pytest Suite with Coverage
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/stockguard
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          RABBITMQ_ENABLED: "true"
        run: |
          python -m pytest --cov=stockguard --cov-report=term-missing --cov-report=xml -v

  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: stockguard:latest
